<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novel – อ่านนิยายออนไลน์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Noto+Serif+Thai:wght@400;600&family=Sarabun:wght@400;600&family=Kanit:wght@400;500&family=Mali:wght@400;600&family=Niramit:wght@400;600&display=swap">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#1c2733;--mut:#5b6b78;--acc:#0f766e;--on:#fff;--hi:#f2b134;--line:#d5dedc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141c22;--card:#1c2830;--ink:#e6edf0;--mut:#9db0ba;--acc:#4fd1c0;--on:#0b1418;--line:#2c3b45}}
:root[data-theme="dark"]{--bg:#141c22;--card:#1c2830;--ink:#e6edf0;--mut:#9db0ba;--acc:#4fd1c0;--on:#0b1418;--line:#2c3b45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:calc(var(--fs,18px)*.89);line-height:1.6;font-family:var(--ff,Prompt),system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 12px}
h1{font-size:1.625em;margin:0;font-weight:600}
h2{font-size:1.125em;margin:24px 0 10px;font-weight:600}
.ic{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.card{display:flex;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.cover{flex:none;width:64px;height:88px;border-radius:6px;display:grid;place-items:center;color:#fff;font:600 34px 'Noto Serif Thai',serif}
.card b{display:block;font-weight:600}
.mut{color:var(--mut);font-size:.875em}
.cont{background:var(--acc);color:var(--on);border-color:var(--acc)}
.cont .mut{color:inherit;opacity:.85}
.bar{height:4px;background:var(--hi);width:0;position:fixed;top:0;left:0;z-index:5}
.read{font-family:var(--ff,'Noto Serif Thai'),serif;line-height:1.95;font-size:var(--fs,18px)}
.read h2{font-family:var(--ff,Prompt),sans-serif;font-size:1.1em}
.read p{margin:0 0 1.1em}
.nav{display:flex;gap:10px;margin:24px 0}
.nav button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.nav .pri{background:var(--acc);color:var(--on);border-color:var(--acc)}
.nav button:disabled{opacity:.4;cursor:default}
.tools{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:6px;align-items:center;background:var(--bg);padding:8px 0;z-index:4}
.tools .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools .ff{max-width:112px;padding:8px 6px;background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:40px}
.ch{display:flex;justify-content:space-between;width:100%;text-align:left;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.ch.done{color:var(--mut)}
.cp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px}
.cp[hidden]{display:none}
.cp .ff{max-width:none}
.fsv{min-width:2.4em;text-align:center;font-weight:600}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);font:600 18px 'Noto Serif Thai',serif;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.cpr{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:12px}
.cpr label{display:flex;align-items:center;gap:8px}
.cpr input[type=color]{width:44px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.note{font-size:.8125em;color:var(--mut);margin-top:24px}
@media (prefers-reduced-motion:no-preference){.card:active,.ch:active{transform:scale(.99)}}
.f{display:block;margin:12px 0 4px;font-weight:500}
.in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
textarea.in{min-height:180px;font-family:var(--ff,'Noto Serif Thai'),serif;line-height:1.8}
.btn{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.btn.pri{background:var(--acc);color:var(--on);border-color:var(--acc)}
.btn.dng{border-color:#e5604d;color:#e5604d}
.row{display:flex;gap:10px;margin-top:16px}.row .btn{flex:1}
.err{color:#e5604d;font-size:.875em;margin-top:8px}
.menu{position:absolute;right:0;top:100%;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:8px}
.menu button:hover{background:var(--bg)}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="wrap" id="app"></div>
<script>
var N=[
{id:'tea',v:12400,f:3200,t:'ร้านชาเที่ยงคืน',a:'ใบชา',g:'แฟนตาซี',c:'#0f766e',d:'ร้านเล็กหลังตลาดเก่าที่เปิดเฉพาะคืนฝนตก และเสิร์ฟชาที่ตรงกับใจลูกค้า',ch:[
['ป้ายไฟดวงเดียว','ซอยหลังตลาดเก่าเงียบลงทุกคืนหลังสี่ทุ่ม เหลือเพียงป้ายไฟดวงเดียวที่ยังกะพริบอยู่หน้าร้านเล็ก ๆ ชื่อ “ชาเที่ยงคืน”\nพิมพ์ใจเปิดประตูเข้าไปทั้งที่ตัวเปียกฝนไปครึ่งหนึ่ง เธอไม่ได้ตั้งใจจะซื้ออะไร แค่อยากหลบฝนสักครู่ก่อนกลับหอ\n“นั่งตรงไหนก็ได้ค่ะ” เสียงหญิงชราดังมาจากหลังเคาน์เตอร์ “วันนี้มีชาให้เลือกแค่ชนิดเดียว”\n“ชนิดอะไรคะ”\n“ชนิดที่เธอกำลังต้องการ”\nพิมพ์ใจขมวดคิ้ว แต่ยังไม่ทันถามต่อ ถ้วยชาใบเล็กก็ถูกวางลงตรงหน้า กลิ่นหอมอ่อน ๆ ลอยขึ้นมา เป็นกลิ่นเดียวกับห้องครัวของยายที่เธอไม่ได้กลับไปนานหลายปี'],
['ถ้วยที่สอง','เธอจิบชาถ้วยแรกหมดโดยไม่รู้ตัว ความอุ่นแผ่จากอกไปถึงปลายนิ้ว เหมือนมีใครวางมือลงบนไหล่เบา ๆ\n“ขออีกถ้วยได้ไหมคะ”\n“ได้สิ แต่ถ้วยที่สองต้องแลกด้วยเรื่องเล่าหนึ่งเรื่อง” หญิงชราบอกพลางยิ้มมุมปาก “เรื่องที่เธอไม่เคยเล่าให้ใครฟัง”\nพิมพ์ใจเงียบไปนาน ฝนนอกร้านซาลงเป็นเสียงกระซิบ ก่อนที่เธอจะเริ่มพูดถึงจดหมายฉบับหนึ่งที่เขียนไว้ตั้งแต่ปีที่แล้ว และยังไม่กล้าส่งถึงใคร'],
['ลูกค้าคนสุดท้าย','เมื่อเรื่องเล่าจบ ชาถ้วยที่สองก็อุ่นพอดี พิมพ์ใจเงยหน้าขึ้นและเห็นว่าในร้านมีแต่เธอคนเดียว ไม่มีหญิงชรา ไม่มีเคาน์เตอร์ มีเพียงโต๊ะไม้ตัวเก่ากับป้ายเล็ก ๆ วางอยู่บนโต๊ะ\n“ขอบคุณที่มาเป็นลูกค้าคนสุดท้ายของคืนนี้ พรุ่งนี้ร้านจะไปอยู่ในซอยของคนอื่น”\nเธอเดินออกมาเมื่อฝนหยุด ป้ายไฟหน้าร้านดับลงพร้อมกับที่โทรศัพท์สั่นขึ้นมา เป็นข้อความจากคนที่เธอตั้งใจเขียนจดหมายถึง']]},
{id:'star',v:8300,f:5100,t:'จดหมายจากดาวดวงที่เจ็ด',a:'ปลายฟ้า',g:'ไซไฟ',c:'#5b3a8c',d:'นักดาราศาสตร์รุ่นเยาว์ได้รับสัญญาณที่เขียนเป็นภาษาไทยจากที่ไกลเกินกว่าจะเป็นไปได้',ch:[
['สัญญาณ 7.3 เมกะเฮิรตซ์','หอดูดาวบนดอยเงียบผิดปกติตั้งแต่หัวค่ำ กรวินท์นั่งตรวจข้อมูลคลื่นวิทยุที่เก็บมาตลอดสัปดาห์ด้วยความง่วง จนกระทั่งกราฟเส้นหนึ่งสะดุดตาเขา\nมันไม่ใช่สัญญาณรบกวน ไม่ใช่ดาวเคราะห์น้อย และไม่ใช่ดาวเทียมของประเทศใด ความถี่ซ้ำเป็นจังหวะ สั้น ยาว สั้น เหมือนใครสักคนกำลังเคาะประตู\nเขาลองแปลงรหัสตามตารางง่าย ๆ ที่เรียนมาตอนปีหนึ่ง แล้วต้องกลั้นหายใจ เพราะตัวอักษรที่ปรากฏขึ้นบนจอคือคำว่า “สวัสดี”'],
['คำตอบที่ส่งกลับไป','ศาสตราจารย์บอกให้เขาอย่าเพิ่งตอบ แต่กรวินท์ไม่เคยเป็นคนที่รอได้ เขาพิมพ์ข้อความสั้น ๆ ลงในระบบส่งสัญญาณสำรองเมื่อเที่ยงคืน\n“คุณคือใคร”\nสามชั่วโมงต่อมา คำตอบก็มาถึงพร้อมแสงเหนือที่ปรากฏผิดที่ผิดเวลาเหนือยอดดอย “เราคือคนที่เคยเป็นเธอ ในอีกเจ็ดสิบปีข้างหน้า”']]},
{id:'mkt',v:5100,f:1800,t:'ตลาดน้ำหลังฝนตก',a:'ธารทิพย์',g:'สืบสวน',c:'#b4532a',d:'พ่อค้าขายขนมหายไปจากตลาดน้ำ ทิ้งไว้เพียงเรือเปล่าและโน้ตเปียกน้ำหนึ่งใบ',ch:[
['เรือลำที่หก','ตลาดน้ำเช้าวันนั้นคึกคักเหมือนทุกวัน ยกเว้นเรือลำที่หกจากท่าน้ำที่จอดนิ่งอยู่โดยไม่มีคนพาย ในเรือมีเตาถ่านยังอุ่นอยู่ และขนมตาลหนึ่งถาดที่ยังไม่มีใครแตะ\nสิริน นักข่าวฝึกหัด ก้มลงเก็บกระดาษแผ่นเล็กที่เปียกน้ำจนหมึกเลอะ เหลือเพียงตัวเลขสามหลักกับคำว่า “อย่าไว้ใจ”\n“ลุงสมชายไม่เคยทิ้งเตาไว้เฉย ๆ หรอก” แม่ค้าข้างเรือกระซิบ “เว้นแต่จะมีอะไรน่ากลัวกว่าไฟ”'],
['ตัวเลขสามหลัก','สิรินใช้เวลาทั้งบ่ายเดินถามคนในตลาด และพบว่าไม่มีใครรู้จักตัวเลขนั้น จนกระทั่งเด็กชายคนหนึ่งชี้ไปที่ตู้ไปรษณีย์เก่าริมท่าน้ำ “เลขที่ช่องเก็บของค่ะพี่ ตู้นั้นไม่มีใครเปิดมาสิบปีแล้ว”\nกุญแจไม่อยู่ในมือใคร แต่สนิมที่เกาะอยู่บนบานพับกลับมีรอยขูดใหม่ ๆ เธอจึงรู้ว่ามีคนมาถึงที่นี่ก่อนเธอแล้ว']]},
{id:'cafe',v:9800,f:6400,t:'จดหมายถึงคนที่ยังไม่รู้จัก',a:'ลมหวน',g:'โรแมนติก',c:'#8a3b5f',d:'สองคนแลกจดหมายผ่านตู้ไปรษณีย์ริมทางรถไฟ โดยไม่รู้ว่าอีกฝ่ายคือใคร',ch:[
['ตู้ไปรษณีย์สีแดง','ตู้ไปรษณีย์สีแดงหน้าสถานีรถไฟเก่าไม่มีใครใช้มานาน จนวันที่ใบบัวเจอซองสีครีมโผล่ออกมาจากช่องรับจดหมาย\nข้างในเขียนสั้น ๆ ว่า “ถ้าคุณอ่านอยู่ ขอให้วันนี้เป็นวันที่ดี” ลายมือเรียบร้อยและไม่มีชื่อผู้ส่ง\nเธอยิ้มโดยไม่รู้ตัว แล้วหยิบปากกาเขียนตอบกลับไปหนึ่งบรรทัด'],
['คำตอบที่ตกหล่น','สามวันต่อมา ซองใบใหม่ก็มาถึงพร้อมคำถามว่าเธอชอบฟังเสียงอะไรตอนฝนตก ใบบัวตอบว่าเสียงรถไฟไกล ๆ\nจดหมายทุกฉบับเริ่มยาวขึ้น จนวันหนึ่งอีกฝ่ายเขียนว่า “พรุ่งนี้ผมจะยืนรอที่ชานชาลา ถ้าคุณไม่อยากพบ ก็ไม่เป็นไร”']]},
{id:'dorm',v:15200,f:4100,t:'ชั้นสี่ห้อง 404',a:'เงาจาง',g:'สยองขวัญ',c:'#2f3e46',d:'หอพักเก่าที่ชั้นสี่ไม่มีทางขึ้น แต่ทุกคืนมีเสียงเคาะประตูห้องที่ไม่มีอยู่จริง',ch:[
['เสียงเคาะตอนตีสอง','ทุกคนในหอบอกว่าชั้นสี่ปิดตายมานานแล้ว บันไดถูกกั้นด้วยแผ่นเหล็ก แต่ภูมิคิดว่าเขาได้ยินเสียงเคาะประตูทุกคืนตอนตีสอง\nสามครั้ง ช้า ๆ แล้วเงียบ เหมือนใครสักคนรออยู่ตรงนั้นมานาน\nคืนนี้เสียงเคาะดังมาจากประตูห้องของเขาเอง'],
['ประตูบานที่ไม่มี','ภูมิตัดสินใจเปิดประตู แต่ที่หน้าห้องมีแค่ทางเดินมืดกับป้ายเลขห้อง 404 ที่ไม่เคยมีอยู่มาก่อน\nกลิ่นกำยานจาง ๆ ลอยมาจากปลายทาง และเสียงกระซิบบอกว่า “ขอบคุณที่เปิดให้เสียที”']]},
{id:'sea',v:7200,f:2600,t:'เข็มทิศของกัปตันเด็ก',a:'คลื่นใต้',g:'ผจญภัย',c:'#1d4e89',d:'เด็กชายได้เข็มทิศเก่าที่ไม่ชี้ทิศเหนือ แต่ชี้ไปหาสิ่งที่เขาต้องการที่สุด',ch:[
['ของขวัญจากท่าเรือ','ชายแก่ที่ท่าเรือยื่นเข็มทิศทองเหลืองให้ทะเลโดยไม่พูดอะไร เข็มของมันหมุนติ้วไม่ยอมหยุดที่ทิศเหนือ\nจนเขาเผลอนึกถึงพ่อที่ออกทะเลไปเมื่อสามปีก่อน เข็มก็นิ่งลงและชี้ออกไปกลางทะเล\n“ไปสิ” ชายแก่บอก “แต่ต้องกลับมาก่อนน้ำขึ้น”'],
